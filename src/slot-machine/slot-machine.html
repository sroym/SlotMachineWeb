<h1>{{ Name() }}</h1>
<h2>Hello! {{ UserName() }}</h2>
<button (click)="ClickLogout()">登出</button>
<input [(ngModel)]="Bet">
<button (click)="ClickSpin()">Spin</button>
<h3>餘額: ${{Money()}}</h3>

}
 <div class="screen">

     <div class="reel-wrap">
       <div class="reel-inner"[id]=" 'reel-' +col"></div>
     </div>
   }
 </div>
