<h1>{{ Name() }}</h1>
<input [(ngModel)]="Bet">
<button (click)="ClickSpin()">Spin</button>
@if(isSpin()){
  <h3>我贏了 ${{Money()}} </h3>
  <h3>螢幕: </h3>

 <div class="Screen">
   @for (row of TransposedScreen();track $index){
     <div class="row" [class.winning-row]="$index >= 1 && $index <= 3">
       @for (cell of row; track $index){
         <div class="cell">{{cell}}</div>
       }
     </div>
   }
 </div>
}
