<h1>{{ Name() }}</h1>
<h2>Hello! {{ UserName() }}</h2>
<button (click)="ClickLogout()">登出</button>
<input [(ngModel)]="Bet">
<button (click)="ClickSpin()">Spin</button>
<h3>餘額: ${{Money()}}</h3>
@if(TransposedScreen().length>0){
  <h3>這次贏了 ${{WinMoney()}} </h3>
  <h3>螢幕: </h3>

 <div class="Screen">
   @for (row of TransposedScreen();track $index){
     <div class="row">
       @for (cell of row; track $index){
         <div class="cell">{{cell}}</div>
       }
     </div>
   }
 </div>
}
